<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="session-video-intake">
  <title>session-video-intake</title>
  <defs>
    <linearGradient id="vid-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343947"/><stop offset=".55" stop-color="#1c202b"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="vid-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vid-bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/><stop offset="1" stop-color="#e9d9c1"/>
    </linearGradient>
    <linearGradient id="vid-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc670"/><stop offset="1" stop-color="#ffab3d"/>
    </linearGradient>
    <filter id="vid-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.7" stdDeviation="1.2" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <clipPath id="vid-clip"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
    <clipPath id="vid-barclip"><rect x="10.5" y="12.5" width="43" height="8.4" rx="2.6"/></clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#vid-bg)"/>
  <g clip-path="url(#vid-clip)">
    <path d="M2 26C8 10 22 2 36 2h26v14C48 12 22 14 2 32z" fill="url(#vid-hi)"/>
    <circle cx="50" cy="12" r="10" fill="#fff" opacity=".05"/>
  </g>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5"/>

  <g filter="url(#vid-sh)">
    <!-- clapper bar -->
    <g transform="rotate(-10 32 17)">
      <rect x="10.5" y="12.5" width="43" height="8.4" rx="2.6" fill="url(#vid-bar)"/>
      <g clip-path="url(#vid-barclip)" fill="#ffb454">
        <path d="M14 12.5h6l-3.6 8.4h-6z"/>
        <path d="M26 12.5h6l-3.6 8.4h-6z"/>
        <path d="M38 12.5h6l-3.6 8.4h-6z"/>
        <path d="M50 12.5h6l-3.6 8.4h-6z"/>
      </g>
      <rect x="10.5" y="12.5" width="43" height="8.4" rx="2.6" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
    </g>

    <!-- slate body -->
    <rect x="10.5" y="23" width="43" height="29" rx="5" fill="#2a2f3d" stroke="#fff" stroke-opacity=".26" stroke-width="1.3"/>
    <rect x="12.4" y="25" width="39.2" height="25" rx="3.6" fill="#1e232e" opacity=".55"/>

    <!-- storyboard cells -->
    <g>
      <rect x="14.5" y="26.5" width="10.4" height="8.4" rx="1.9" fill="#fff" opacity=".16"/>
      <rect x="26.9" y="26.5" width="10.4" height="8.4" rx="1.9" fill="#fff" opacity=".16"/>
      <rect x="39.3" y="26.5" width="10.4" height="8.4" rx="1.9" fill="#fff" opacity=".16"/>
      <rect x="14.5" y="37.3" width="10.4" height="8.4" rx="1.9" fill="#fff" opacity=".16"/>
      <rect x="26.9" y="37.3" width="22.8" height="8.4" rx="1.9" fill="url(#vid-amber)"/>
      <!-- sparkle replaces the play mark -->
      <path d="M38.3 37.9C38.78 40.28 39.52 41.02 41.9 41.5 39.52 41.98 38.78 42.72 38.3 45.1 37.82 42.72 37.08 41.98 34.7 41.5 37.08 41.02 37.82 40.28 38.3 37.9Z" fill="#232834"/>
    </g>
  </g>
</svg>

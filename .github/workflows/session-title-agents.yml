name: session-title-agents checks
on:
  push:
    paths:
      - 'plugins/session-title-agents/**'
      - '.github/workflows/session-title-agents.yml'
  pull_request:
    paths:
      - 'plugins/session-title-agents/**'
      - '.github/workflows/session-title-agents.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/session-title-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
